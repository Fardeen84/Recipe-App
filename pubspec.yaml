name: recipe
description: "Context-aware recipe discovery app - production grade"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  dio: ^5.4.0
  connectivity_plus: ^6.0.3
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  intl: ^0.19.0
  equatable: ^2.0.5
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
